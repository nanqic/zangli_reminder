name = "zangli-reminder"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
# UTC 00:00 = 北京时间 08:00：荟供提前一天提醒，殊胜日当天提醒
crons = ["0 0 * * *"]

[observability]
enabled = true

[vars]
BOT_USERNAME = "荟供提醒"
# 守持规则（代码内固定）：缺日提前一天，重日只守第一天
AUSPICIOUS_BOT_USERNAME = "殊胜日提醒"
# 机密配置不要写在这里，用 wrangler secret put：
#   WEBHOOK_URL             荟供频道 webhook
#   AUSPICIOUS_WEBHOOK_URL  殊胜日频道 webhook
#   ZOOM_ID / ZOOM_PASSWORD
#   TEST_TOKEN   POST /test 的鉴权 token

# 荟供活动信息（附在提醒末尾）。ZOOM_ID / ZOOM_PASSWORD 用 secret 配置
EVENT_TIME_BJ = "20:15"
OFFERING_NOTE = "需要准备好荟供品，各种水果、零食均可"
